server:
  forward-headers-strategy: framework
spring:
  datasource:
    url: jdbc:h2:mem:fp-${random.uuid};MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS app
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: app

flowpulse:
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789
    access-minutes: 15
    refresh-days: 7
  cors:
    allowed-origins: http://localhost:5173
  ai-service:
    url: http://localhost:8000
  bootstrap-admin:
    email: admin@test.local
    password: admin-test-pass
  demo-users:
    enabled: true
    password: demo-test-pass
